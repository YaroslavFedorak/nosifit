<div class="modal nf-modal" id="modal-update-weight" role="dialog" aria-modal="true" aria-labelledby="weight-modal-title">
  <div class="modal-content nf-modal-card">
    <header class="nf-modal-header">
      <div class="nf-modal-heading">
        <span class="nf-modal-eyebrow">{{ translate("nutrition", "modals.eyebrow.weight") }}</span>
        <h2 class="nf-modal-title" id="weight-modal-title">{{ translate("nutrition", "weight.updateTitle") }}</h2>
      </div>
      {% include "app/nutrition/modals/_close_button.html" %}
    </header>

    <div class="nf-field">
      <label class="nf-label" for="update-weight-value">{{ translate("nutrition", "weight.current") }}</label>
      <div class="nf-input-wrap">
        <input class="nf-input" type="number" id="update-weight-value" min="20" max="400" step="0.1" inputmode="decimal" placeholder="75.0" autocomplete="off" />
        <span class="nf-input-unit">{{ translate("nutrition", "units.kg") }}</span>
      </div>
    </div>

    <p class="nf-modal-error" data-modal-error role="alert" hidden></p>

    <footer class="nf-modal-footer">
      <button type="button" class="nf-btn" id="close-update-weight">{{ translate("nutrition", "actions.cancel") }}</button>
      <button type="button" class="nf-btn nf-btn--primary" id="save-update-weight">{{ translate("nutrition", "actions.update") }}</button>
    </footer>
  </div>
</div>
