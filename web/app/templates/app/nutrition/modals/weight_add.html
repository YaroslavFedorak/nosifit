<div class="modal" id="modal-update-weight">
  <div class="modal-content">
    <h2>{{ translate("nutrition", "weight.updateTitle") }}</h2>

    <label for="update-weight-value">
      {{ translate("nutrition", "weight.value") }}
    </label>

    <div class="water-input-wrapper">
      <input
        type="number"
        id="update-weight-value"
        min="1"
        max="500"
        step="0.1"
        inputmode="decimal"
        placeholder="78.5"
        autocomplete="off"
      />

      <span class="water-input-unit">
        {{ translate("nutrition", "units.kg") }}
      </span>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn" id="close-update-weight">
        {{ translate("nutrition", "actions.cancel") }}
      </button>

      <button type="button" class="btn primary" id="save-update-weight">
        {{ translate("nutrition", "actions.update") }}
      </button>
    </div>
  </div>
</div>
