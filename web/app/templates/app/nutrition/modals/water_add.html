<div class="modal nf-modal" id="modal-water" role="dialog" aria-modal="true" aria-labelledby="water-modal-title">
  <div class="modal-content nf-modal-card">
    <header class="nf-modal-header">
      <div class="nf-modal-heading">
        <span class="nf-modal-eyebrow nf-modal-eyebrow--water">{{ translate("nutrition", "modals.eyebrow.water") }}</span>
        <h2 class="nf-modal-title" id="water-modal-title">{{ translate("nutrition", "water.addTitle") }}</h2>
      </div>
      {% include "app/nutrition/modals/_close_button.html" %}
    </header>

    <div class="nf-segmented nf-segmented--two" role="group" aria-label="{{ translate("nutrition", "water.addTitle") }}">
      <button type="button" class="nf-segmented-button" data-water-mode="add" aria-pressed="true">{{ translate("nutrition", "water.modeAdd") }}</button>
      <button type="button" class="nf-segmented-button" data-water-mode="remove" aria-pressed="false">{{ translate("nutrition", "water.modeRemove") }}</button>
    </div>

    <div class="nf-field">
      <label class="nf-label" for="water-amount">{{ translate("nutrition", "water.amount") }}</label>
      <div class="nf-input-wrap">
        <input class="nf-input" type="number" id="water-amount" min="0.05" max="5" step="any" inputmode="decimal" placeholder="0.5" autocomplete="off" />
        <span class="nf-input-unit">{{ translate("nutrition", "units.liters") }}</span>
      </div>
    </div>

    <div class="nf-chips" role="group" aria-label="{{ translate("nutrition", "water.quick") }}">
      <button type="button" class="nf-chip" data-water-preset="0.25">0.25 {{ translate("nutrition", "units.liters") }}</button>
      <button type="button" class="nf-chip" data-water-preset="0.33">0.33 {{ translate("nutrition", "units.liters") }}</button>
      <button type="button" class="nf-chip" data-water-preset="0.5">0.5 {{ translate("nutrition", "units.liters") }}</button>
      <button type="button" class="nf-chip" data-water-preset="1">1 {{ translate("nutrition", "units.liters") }}</button>
    </div>

    <p class="nf-modal-error" data-modal-error role="alert" hidden></p>

    <footer class="nf-modal-footer">
      <button type="button" class="nf-btn" id="close-water-modal">{{ translate("nutrition", "actions.cancel") }}</button>
      <button type="button" class="nf-btn nf-btn--primary" id="save-water"
              data-label-add="{{ translate("nutrition", "actions.add") }}"
              data-label-remove="{{ translate("nutrition", "water.modeRemove") }}">{{ translate("nutrition", "actions.add") }}</button>
    </footer>
  </div>
</div>
