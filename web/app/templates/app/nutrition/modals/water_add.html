<div class="modal" id="modal-water">
  <div class="modal-content">
    <h2>{{ translate("nutrition", "water.addTitle") }}</h2>

    <label for="water-amount">
      {{ translate("nutrition", "water.amount") }}
    </label>

    <div class="water-input-wrapper">
      <input
        type="number"
        id="water-amount"
        min="0.1"
        max="10"
        step="0.1"
        inputmode="decimal"
        placeholder="0.5"
        autocomplete="off"
      />

      <span class="water-input-unit">
        {{ translate("nutrition", "units.liters") }}
      </span>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn" id="close-water-modal">
        {{ translate("nutrition", "actions.cancel") }}
      </button>

      <button type="button" class="btn primary" id="save-water">
        {{ translate("nutrition", "actions.add") }}
      </button>
    </div>
  </div>
</div>
