<div class="modal" id="modal-water">
  <div class="modal-content">
    <h2>Додати воду</h2>

    <label for="water-amount"> Обʼєм </label>

    <div class="water-input-wrapper">
      <input
        type="number"
        id="water-amount"
        min="0.1"
        max="10"
        step="0.1"
        inputmode="decimal"
        placeholder="0.5"
        autocomplete="off"
      />

      <span class="water-input-unit"> л </span>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn" id="close-water-modal">
        Скасувати
      </button>

      <button type="button" class="btn primary" id="save-water">Додати</button>
    </div>
  </div>
</div>
