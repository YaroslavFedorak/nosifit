<div class="modal" id="modal-edit-meal">
  <div class="modal-content">
    <h2>{{ translate("nutrition", "meals.editTitle") }}</h2>

    <p class="modal-hint">{{ translate("nutrition", "meals.editHint") }}</p>

    <input type="hidden" id="edit-meal-id" />

    <label for="edit-meal-name">
      {{ translate("nutrition", "fields.name") }}
    </label>

    <input type="text" id="edit-meal-name" />

    <label for="edit-meal-category">
      {{ translate("nutrition", "fields.category") }}
    </label>

    <select id="edit-meal-category">
      <option value="Сніданок">
        {{ translate("nutrition", "meal_categories.breakfast") }}
      </option>

      <option value="Обід">
        {{ translate("nutrition", "meal_categories.lunch") }}
      </option>

      <option value="Вечеря">
        {{ translate("nutrition", "meal_categories.dinner") }}
      </option>

      <option value="Перекус">
        {{ translate("nutrition", "meal_categories.snack") }}
      </option>
    </select>

    <label for="edit-meal-time">
      {{ translate("nutrition", "fields.time") }}
    </label>

    <input type="time" id="edit-meal-time" />

    <div class="modal-actions">
      <button class="btn" id="close-edit-meal">
        {{ translate("nutrition", "actions.cancel") }}
      </button>

      <button class="btn primary" id="save-edit-meal">
        {{ translate("nutrition", "actions.save") }}
      </button>
    </div>
  </div>
</div>
