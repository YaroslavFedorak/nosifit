<div class="nutrition-day-modal" id="nutrition-day-modal" aria-hidden="true">
  <div
    class="nutrition-day-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="nutrition-day-title"
  >
    <div class="nutrition-day-header">
      <div>
        <div class="nutrition-day-title" id="nutrition-day-title"></div>

        <div class="nutrition-day-subtitle" id="nutrition-day-subtitle"></div>
      </div>

      <button
        type="button"
        class="nutrition-day-close"
        data-close-day
        aria-label="Закрити"
      >
        ×
      </button>
    </div>

    <div class="nutrition-day-stats" id="nutrition-day-stats"></div>

    <div class="nutrition-day-meals" id="nutrition-day-meals"></div>
  </div>
</div>
