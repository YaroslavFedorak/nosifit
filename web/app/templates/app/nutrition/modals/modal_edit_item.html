<div class="modal" id="modal-edit-item">
  <div class="modal-content nutrition-product-modal">
    <h2>{{ translate("nutrition", "items.editTitle") }}</h2>
    <input type="hidden" id="edit-item-id" />
    <label for="edit-item-product">{{ translate("nutrition", "catalog.selectedProduct") }}</label><input type="text" id="edit-item-product" readonly />
    <label for="edit-item-meal-id">{{ translate("nutrition", "catalog.moveMeal") }}</label><select id="edit-item-meal-id"></select>
    <div class="nutrition-entry-fields">
      <div><label for="edit-item-amount">{{ translate("nutrition", "catalog.amount") }}</label><input type="number" id="edit-item-amount" min="0.01" step="0.01" /></div>
      <div><label for="edit-item-unit">{{ translate("nutrition", "catalog.unit") }}</label><select id="edit-item-unit"><option value="g">{{ translate("nutrition", "catalog.units.g") }}</option><option value="ml">{{ translate("nutrition", "catalog.units.ml") }}</option><option value="pcs">{{ translate("nutrition", "catalog.units.pcs") }}</option></select></div>
    </div>
    <div class="modal-actions"><button class="btn" id="close-edit-item">{{ translate("nutrition", "actions.cancel") }}</button><button class="btn primary" id="save-edit-item">{{ translate("nutrition", "actions.save") }}</button></div>
  </div>
</div>
