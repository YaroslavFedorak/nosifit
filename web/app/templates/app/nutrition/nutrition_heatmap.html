<div class="nutrition-heatmap-content">
  <div class="heatmap-months" id="nutrition-heatmap-months"></div>

  <div
    id="nutrition-heatmap-grid"
    class="heatmap-grid"
    aria-label="{{ nutrition_t('heatmap.ariaLabel') }}"
  ></div>

  <div class="heatmap-legend">
    <span> {{ nutrition_t("heatmap.less") }} </span>

    <div
      class="legend-box l0"
      aria-label="{{ nutrition_t('heatmap.noData') }}"
    ></div>

    <div
      class="legend-box l1"
      aria-label="{{ nutrition_t('heatmap.level', value=1) }}"
    ></div>

    <div
      class="legend-box l2"
      aria-label="{{ nutrition_t('heatmap.level', value=2) }}"
    ></div>

    <div
      class="legend-box l3"
      aria-label="{{ nutrition_t('heatmap.level', value=3) }}"
    ></div>

    <div
      class="legend-box l4"
      aria-label="{{ nutrition_t('heatmap.level', value=4) }}"
    ></div>

    <div
      class="legend-box l5"
      aria-label="{{ nutrition_t('heatmap.level', value=5) }}"
    ></div>

    <div
      class="legend-box l6"
      aria-label="{{ nutrition_t('heatmap.level', value=6) }}"
    ></div>

    <span> {{ nutrition_t("heatmap.more") }} </span>
  </div>
</div>
