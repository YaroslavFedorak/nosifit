<section class="profile-card">

    <div
        class="profile-card-header profile-progress-header"
    >
        <div>
            <h2 class="profile-card-title">
                {{ profile_t("progress.title") }}
            </h2>

            <p class="profile-card-subtitle">
                {{ profile_t("progress.subtitle") }}
            </p>
        </div>

        <span class="profile-progress-percentage">
            {{ completion }}%
        </span>
    </div>

    <div
        class="profile-progress-content"
        data-profile-completion="{{ completion }}"
    >

        <div
            class="profile-progress-circle"
            data-progress-circle
        >
            <div class="profile-progress-inner">

                <span class="profile-progress-value">
                    {{ completion }}%
                </span>

                <span class="profile-progress-label">
                    {{ profile_t("progress.profile") }}
                </span>

            </div>
        </div>

        <div class="profile-progress-list">

            <div class="profile-progress-item">
                <span
                    class="profile-progress-dot {% if user.username and user.email %}profile-progress-dot-filled{% endif %}"
                ></span>

                <span class="profile-progress-text">
                    {{ profile_t("progress.account") }}
                </span>
            </div>

            <div class="profile-progress-item">
                <span
                    class="profile-progress-dot {% if profile.age is not none and profile.gender and profile.height is not none and profile.weight is not none %}profile-progress-dot-filled{% endif %}"
                ></span>

                <span class="profile-progress-text">
                    {{ profile_t("progress.body") }}
                </span>
            </div>

            <div class="profile-progress-item">
                <span
                    class="profile-progress-dot {% if profile.goal and profile.activity and profile.experience and profile.workouts_per_week is not none %}profile-progress-dot-filled{% endif %}"
                ></span>

                <span class="profile-progress-text">
                    {{ profile_t("progress.goalsActivity") }}
                </span>
            </div>

            <div class="profile-progress-item">
                <span
                    class="profile-progress-dot {% if profile.training_location and profile.onboarding_completed %}profile-progress-dot-filled{% endif %}"
                ></span>

                <span class="profile-progress-text">
                    {{ profile_t("progress.training") }}
                </span>
            </div>

        </div>

    </div>

</section>
