<section class="profile-card">

    <div class="profile-card-header">
        <div>
            <h2 class="profile-card-title">
                {{ profile_t("actions.title") }}
            </h2>

            <p class="profile-card-subtitle">
                {{ profile_t("actions.subtitle") }}
            </p>
        </div>
    </div>

    <div class="profile-actions-grid">

        <button
            type="button"
            class="profile-btn profile-btn-primary"
            data-modal-open="modal-edit-profile"
        >
            {{ profile_t("actions.editProfile") }}
        </button>

        <button
            type="button"
            class="profile-btn profile-btn-secondary"
            data-modal-open="modal-change-email"
        >
            {{ profile_t("actions.changeEmail") }}
        </button>

        <button
            type="button"
            class="profile-btn profile-btn-secondary"
            data-modal-open="modal-change-password"
        >
            {{ profile_t("actions.changePassword") }}
        </button>

        <button
            type="button"
            class="profile-btn profile-btn-danger"
            data-modal-open="modal-delete-account"
        >
            {{ profile_t("actions.deleteAccount") }}
        </button>

    </div>

</section>
