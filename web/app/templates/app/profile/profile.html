{% set ux_script = "profile" %}
{% set ux_title = translate("ui", "nav.me") %}
{% extends "app/_ux_tab.html" %}

{% block tab_extra %}
<script type="application/json" id="ux-user">{{ {
  "name": user.username or "",
  "goal": common_t("profileOptions.goals." ~ normalize_goal(user.goal)) if user.goal else "",
  "weight": user.weight,
  "premium": true if user.is_premium else false,
  "logout": url_for("auth.logout"),
} | tojson }}</script>
{% endblock %}
