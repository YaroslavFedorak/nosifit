<div
    class="profile-modal-backdrop"
    id="modal-change-password"
    aria-hidden="true"
>
    <div
        class="profile-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="change-password-title"
    >

        <div class="profile-modal-header">

            <h2
                class="profile-modal-title"
                id="change-password-title"
            >
                Змінити пароль
            </h2>

            <button
                type="button"
                class="profile-modal-close"
                data-modal-close
                aria-label="Закрити"
            >
                &times;
            </button>

        </div>

        <form
            method="post"
            action="{{ url_for('password_change.change_password') }}"
        >

            <div class="profile-modal-body">

                <div class="profile-field">

                    <label
                        class="profile-field-label"
                        for="current-password"
                    >
                        Поточний пароль
                    </label>

                    <div class="profile-password-wrapper">

                        <input
                            class="profile-input profile-password-input"
                            id="current-password"
                            type="password"
                            name="current_password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="profile-password-toggle"
                            data-password-toggle
                        >
                            Показати
                        </button>

                    </div>

                </div>

                <div class="profile-field">

                    <label
                        class="profile-field-label"
                        for="new-password"
                    >
                        Новий пароль
                    </label>

                    <div class="profile-password-wrapper">

                        <input
                            class="profile-input profile-password-input"
                            id="new-password"
                            type="password"
                            name="new_password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="profile-password-toggle"
                            data-password-toggle
                        >
                            Показати
                        </button>

                    </div>

                </div>

                <div class="profile-field">

                    <label
                        class="profile-field-label"
                        for="confirm-password"
                    >
                        Підтвердження нового пароля
                    </label>

                    <div class="profile-password-wrapper">

                        <input
                            class="profile-input profile-password-input"
                            id="confirm-password"
                            type="password"
                            name="confirm_password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="profile-password-toggle"
                            data-password-toggle
                        >
                            Показати
                        </button>

                    </div>

                </div>

            </div>

            <div class="profile-modal-footer">

                <button
                    type="button"
                    class="profile-btn profile-btn-ghost"
                    data-modal-close
                >
                    Скасувати
                </button>

                <button
                    type="submit"
                    class="profile-btn profile-btn-primary"
                >
                    Змінити пароль
                </button>

            </div>

        </form>

    </div>
</div>
