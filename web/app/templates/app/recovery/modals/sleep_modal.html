<div class="recovery-modal-backdrop" id="sleep-modal-backdrop" hidden>
  <div class="recovery-modal sleep-modal">
    <div class="sleep-header">
      <div class="sleep-header-icon" id="sleep-header-icon"></div>
      <div class="sleep-header-text">
        <div class="sleep-title">Додати сон</div>
        <div class="sleep-subtitle">
          Запиши період сну для розрахунку відновлення
        </div>
      </div>
    </div>

    <div class="sleep-body">
      <div class="sleep-field-card">
        <label class="sleep-label">Дата сну</label>
        <div class="sleep-input-wrapper">
          <input type="date" class="sleep-input-date" data-sleep-date />
        </div>
      </div>

      <div class="sleep-time-section">
        <label class="sleep-label">Час сну</label>

        <div class="sleep-time-row">
          <div class="sleep-time-field">
            <div class="sleep-time-label">Початок</div>
            <input type="time" class="sleep-input-time" data-sleep-start-time />
          </div>

          <div class="sleep-time-arrow">→</div>

          <div class="sleep-time-field">
            <div class="sleep-time-label">Кінець</div>
            <input type="time" class="sleep-input-time" data-sleep-end-time />
          </div>
        </div>

        <div class="sleep-hint">
          Сон через опівніч буде визначено автоматично.
        </div>
      </div>
    </div>

    <div class="sleep-footer">
      <button class="sleep-btn-cancel" type="button" data-close-sleep>
        Скасувати
      </button>

      <button class="sleep-btn-save" type="button" data-save-sleep>
        Зберегти сон
      </button>
    </div>
  </div>
</div>
