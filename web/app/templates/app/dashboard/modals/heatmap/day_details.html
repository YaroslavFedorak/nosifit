<div
  id="dashboard-day-details-modal"
  class="db-modal heatmap-day-details-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="dashboard-day-details-title"
  aria-hidden="true"
>
  <div class="db-modal-panel">
    <div class="db-modal-header">
      <div class="db-modal-heading">
        <div class="widget-eyebrow">
          {{ dashboard_t("heatmap.modal.dayHistory") }}
        </div>

        <h2 id="dashboard-day-details-title" class="db-modal-title">
          {{ dashboard_t("heatmap.modal.dayDetails") }}
        </h2>

        <p id="dashboard-day-details-date" class="db-modal-subtitle">—</p>
      </div>

      <button
        type="button"
        class="db-modal-close"
        id="dashboard-day-details-modal-close"
        aria-label="{{ dashboard_t('heatmap.modal.close') }}"
        data-modal-close
      >
        ×
      </button>
    </div>

    <div id="dashboard-day-details-content" class="db-modal-body"></div>
  </div>
</div>
