<div
  id="dashboard-calendar-modal"
  class="db-modal heatmap-calendar-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="dashboard-calendar-modal-title"
  aria-hidden="true"
>
  <div class="db-modal-panel">
    <div class="db-modal-header">
      <div class="db-modal-heading">
        <div class="widget-eyebrow">{{ dashboard_t("heatmap.eyebrow") }}</div>

        <h2 id="dashboard-calendar-modal-title" class="db-modal-title">
          {{ dashboard_t("heatmap.calendar") }}
        </h2>

        <p class="db-modal-subtitle">
          {{ dashboard_t("heatmap.modal.dayHistory") }}
        </p>
      </div>

      <button
        type="button"
        class="db-modal-close"
        id="dashboard-calendar-modal-close"
        aria-label="{{ dashboard_t('heatmap.modal.close') }}"
        data-modal-close
      >
        ×
      </button>
    </div>

    <div id="dashboard-calendar-content" class="db-modal-body"></div>
  </div>
</div>
