<div class="modal" id="modal-add-meal">
  <div class="modal-content">
    <h2>{{ dashboard_t("nutrition.newMeal") }}</h2>

    <p class="modal-hint">{{ dashboard_t("nutrition.addMealHint") }}</p>

    <label for="add-meal-category">
      {{ dashboard_t("nutrition.category") }}
    </label>

    <select id="add-meal-category">
      <option value="Сніданок">
        {{ dashboard_t("nutrition.mealCategories.breakfast") }}
      </option>
      <option value="Обід">
        {{ dashboard_t("nutrition.mealCategories.lunch") }}
      </option>
      <option value="Вечеря">
        {{ dashboard_t("nutrition.mealCategories.dinner") }}
      </option>
      <option value="Перекус">
        {{ dashboard_t("nutrition.mealCategories.snack") }}
      </option>
    </select>

    <label for="add-meal-time"> {{ dashboard_t("nutrition.time") }} </label>
    <input type="time" id="add-meal-time" />

    <div class="modal-actions">
      <button type="button" class="btn" id="close-add-meal">
        {{ dashboard_t("nutrition.cancel") }}
      </button>

      <button type="button" class="btn primary" id="save-add-meal">
        {{ dashboard_t("nutrition.create") }}
      </button>
    </div>
  </div>
</div>
