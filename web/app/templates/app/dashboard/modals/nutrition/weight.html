<div class="modal" id="modal-update-weight">
  <div class="modal-content">
    <div class="modal-header">
      <div>
        <span class="modal-eyebrow">
          {{ dashboard_t("nutrition.weight") }}
        </span>

        <h2>{{ dashboard_t("nutrition.updateWeight") }}</h2>
      </div>
    </div>

    <div class="modal-field">
      <label for="update-weight-value">
        {{ dashboard_t("nutrition.currentWeight") }}
      </label>

      <div class="modal-input-wrapper">
        <input
          type="number"
          id="update-weight-value"
          min="1"
          max="500"
          step="0.1"
          inputmode="decimal"
          placeholder="78.5"
          autocomplete="off"
        />

        <span class="modal-input-unit">
          {{ dashboard_t("nutrition.weightUnit") }}
        </span>
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn" id="close-update-weight">
        {{ dashboard_t("nutrition.cancel") }}
      </button>

      <button type="button" class="btn primary" id="save-update-weight">
        {{ dashboard_t("nutrition.update") }}
      </button>
    </div>
  </div>
</div>
