<div class="modal" id="modal-add-item">
  <div class="modal-content">
    <h2>{{ dashboard_t("nutrition.addProductTitle") }}</h2>

    <input type="hidden" id="add-item-meal-id" />

    <label for="add-item-name"> {{ dashboard_t("nutrition.name") }} </label>
    <input type="text" id="add-item-name" autocomplete="off" />

    <label for="add-item-kcal"> {{ dashboard_t("nutrition.calories") }} </label>
    <input
      type="number"
      id="add-item-kcal"
      value="0"
      min="0"
      step="1"
      inputmode="numeric"
    />

    <label for="add-item-protein">
      {{ dashboard_t("nutrition.protein") }}
    </label>
    <input
      type="number"
      id="add-item-protein"
      value="0"
      min="0"
      step="0.1"
      inputmode="decimal"
    />

    <label for="add-item-fat"> {{ dashboard_t("nutrition.fat") }} </label>
    <input
      type="number"
      id="add-item-fat"
      value="0"
      min="0"
      step="0.1"
      inputmode="decimal"
    />

    <label for="add-item-carb"> {{ dashboard_t("nutrition.carbs") }} </label>
    <input
      type="number"
      id="add-item-carb"
      value="0"
      min="0"
      step="0.1"
      inputmode="decimal"
    />

    <div class="modal-actions">
      <button type="button" class="btn" id="close-add-item">
        {{ dashboard_t("nutrition.cancel") }}
      </button>

      <button type="button" class="btn primary" id="save-add-item">
        {{ dashboard_t("nutrition.add") }}
      </button>
    </div>
  </div>
</div>
