<div class="modal" id="modal-edit-item">
  <div class="modal-content">
    <h2>{{ dashboard_t("nutrition.editProduct") }}</h2>

    <input type="hidden" id="edit-item-id" />

    <label for="edit-item-name"> {{ dashboard_t("nutrition.name") }} </label>
    <input type="text" id="edit-item-name" autocomplete="off" />

    <label for="edit-item-kcal">
      {{ dashboard_t("nutrition.calories") }}
    </label>
    <input
      type="number"
      id="edit-item-kcal"
      min="0"
      step="1"
      inputmode="numeric"
    />

    <label for="edit-item-protein">
      {{ dashboard_t("nutrition.protein") }}
    </label>
    <input
      type="number"
      id="edit-item-protein"
      min="0"
      step="0.1"
      inputmode="decimal"
    />

    <label for="edit-item-fat"> {{ dashboard_t("nutrition.fat") }} </label>
    <input
      type="number"
      id="edit-item-fat"
      min="0"
      step="0.1"
      inputmode="decimal"
    />

    <label for="edit-item-carb"> {{ dashboard_t("nutrition.carbs") }} </label>
    <input
      type="number"
      id="edit-item-carb"
      min="0"
      step="0.1"
      inputmode="decimal"
    />

    <div class="modal-actions">
      <button type="button" class="btn" id="close-edit-item">
        {{ dashboard_t("nutrition.cancel") }}
      </button>

      <button type="button" class="btn primary" id="save-edit-item">
        {{ dashboard_t("nutrition.save") }}
      </button>
    </div>
  </div>
</div>
