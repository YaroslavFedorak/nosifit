<div class="modal" id="modal-edit-meal">
  <div class="modal-content">
    <h2>{{ dashboard_t("nutrition.editMeal") }}</h2>

    <p class="modal-hint">{{ dashboard_t("nutrition.editMealHint") }}</p>

    <input type="hidden" id="edit-meal-id" />

    <label for="edit-meal-name"> {{ dashboard_t("nutrition.name") }} </label>
    <input type="text" id="edit-meal-name" autocomplete="off" />

    <label for="edit-meal-category">
      {{ dashboard_t("nutrition.category") }}
    </label>

    <select id="edit-meal-category">
      <option value="breakfast">
        {{ dashboard_t("nutrition.mealCategories.breakfast") }}
      </option>
      <option value="lunch">
        {{ dashboard_t("nutrition.mealCategories.lunch") }}
      </option>
      <option value="dinner">
        {{ dashboard_t("nutrition.mealCategories.dinner") }}
      </option>
      <option value="snack">
        {{ dashboard_t("nutrition.mealCategories.snack") }}
      </option>
    </select>

    <label for="edit-meal-time"> {{ dashboard_t("nutrition.time") }} </label>
    <input type="time" id="edit-meal-time" />

    <div class="modal-actions">
      <button type="button" class="btn" id="close-edit-meal">
        {{ dashboard_t("nutrition.cancel") }}
      </button>

      <button type="button" class="btn primary" id="save-edit-meal">
        {{ dashboard_t("nutrition.save") }}
      </button>
    </div>
  </div>
</div>
