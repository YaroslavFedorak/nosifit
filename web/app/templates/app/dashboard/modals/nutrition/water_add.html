<div class="modal" id="modal-water">
  <div class="modal-content">
    <h2>{{ dashboard_t("nutrition.addWater") }}</h2>

    <label for="water-amount"> {{ dashboard_t("nutrition.volume") }} </label>

    <div class="water-input-wrapper">
      <input
        type="number"
        id="water-amount"
        min="0.1"
        max="10"
        step="0.1"
        inputmode="decimal"
        placeholder="0.5"
        autocomplete="off"
      />

      <span class="water-input-unit">
        {{ dashboard_t("nutrition.liters") }}
      </span>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn" id="close-water-modal">
        {{ dashboard_t("nutrition.cancel") }}
      </button>

      <button type="button" class="btn primary" id="save-water">
        {{ dashboard_t("nutrition.add") }}
      </button>
    </div>
  </div>
</div>
