<div class="heatmap-widget" id="dashboard-heatmap-widget">
  <div class="heatmap-widget-header">
    <div>
      <div class="widget-eyebrow">Історія</div>
    </div>

    <div class="heatmap-controls">
      <button
        type="button"
        class="heatmap-calendar-button"
        id="dashboard-open-calendar"
      >
        Календар
      </button>
    </div>
  </div>

  <div class="nutrition-heatmap-content">
    <div
      class="heatmap-months"
      id="dashboard-heatmap-months"
      aria-hidden="true"
    ></div>

    <div
      id="dashboard-heatmap"
      class="heatmap-grid"
      role="grid"
      aria-label="Heatmap загального стану"
    ></div>

    <div class="heatmap-legend">
      <span>Менше</span>

      <div class="legend-box l0" aria-label="Немає даних"></div>

      <div class="legend-box l1" aria-label="Рівень 1"></div>

      <div class="legend-box l2" aria-label="Рівень 2"></div>

      <div class="legend-box l3" aria-label="Рівень 3"></div>

      <div class="legend-box l4" aria-label="Рівень 4"></div>

      <div class="legend-box l5" aria-label="Рівень 5"></div>

      <div class="legend-box l6" aria-label="Рівень 6"></div>

      <span>Більше</span>
    </div>
  </div>
</div>
