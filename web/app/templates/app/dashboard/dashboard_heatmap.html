<div class="heatmap-widget" id="dashboard-heatmap-widget">
  <div class="heatmap-widget-header">
    <div>
      <div class="widget-eyebrow">{{ dashboard_t("heatmap.eyebrow") }}</div>
    </div>

    <div class="heatmap-controls">
      <button
        type="button"
        class="heatmap-calendar-button"
        id="dashboard-open-calendar"
      >
        {{ dashboard_t("heatmap.calendar") }}
      </button>
    </div>
  </div>

  <div class="nutrition-heatmap-content">
    <div
      class="heatmap-months"
      id="dashboard-heatmap-months"
      aria-hidden="true"
    ></div>

    <div
      id="dashboard-heatmap"
      class="heatmap-grid"
      role="grid"
      aria-label="{{ dashboard_t('heatmap.ariaLabel') }}"
    ></div>

    <div class="heatmap-legend">
      <span>{{ dashboard_t("heatmap.less") }}</span>

      <div
        class="legend-box l0"
        aria-label="{{ dashboard_t('heatmap.noData') }}"
      ></div>

      <div
        class="legend-box l1"
        aria-label="{{ dashboard_t('heatmap.level', level=1) }}"
      ></div>

      <div
        class="legend-box l2"
        aria-label="{{ dashboard_t('heatmap.level', level=2) }}"
      ></div>

      <div
        class="legend-box l3"
        aria-label="{{ dashboard_t('heatmap.level', level=3) }}"
      ></div>

      <div
        class="legend-box l4"
        aria-label="{{ dashboard_t('heatmap.level', level=4) }}"
      ></div>

      <div
        class="legend-box l5"
        aria-label="{{ dashboard_t('heatmap.level', level=5) }}"
      ></div>

      <div
        class="legend-box l6"
        aria-label="{{ dashboard_t('heatmap.level', level=6) }}"
      ></div>

      <span>{{ dashboard_t("heatmap.more") }}</span>
    </div>
  </div>
</div>
