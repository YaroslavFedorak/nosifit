{% from "public/landing/_icons.html" import module_icon %}
<section class="lp-hero" aria-labelledby="lp-hero-title">
  <div class="lp-wrap lp-hero-grid">
    <div class="lp-hero-copy" data-reveal>
      <p class="lp-hero-eyebrow">{{ L.hero.eyebrow }}</p>
      <h1 id="lp-hero-title" class="lp-hero-title">{{ L.hero.title }}</h1>
      <p class="lp-hero-lead">{{ L.hero.lead }}</p>

      <div class="lp-actions">
        <a href="{{ url_for('auth.register') }}" class="cmp-btn cmp-btn-primary cmp-btn-lg">{{ L.hero.start }}</a>
        <a href="{{ url_for('public.demo') }}" class="cmp-btn cmp-btn-ghost cmp-btn-lg">{{ L.hero.demo }}</a>
      </div>
      <p class="lp-note">{{ L.hero.note }}</p>
    </div>

    <figure class="lp-day cmp-card" data-reveal aria-label="{{ L.day.aria }}">
      <header class="lp-day-head">
        <span class="lp-icon-box" aria-hidden="true">{{ module_icon("dashboard") }}</span>
        <div class="lp-day-heading">
          <span class="lp-micro">{{ L.day.label }}</span>
          <strong class="lp-day-date">{{ L.day.date }}</strong>
        </div>
        <span class="lp-sample">{{ L.sample }}</span>
      </header>

      <ul class="lp-signals">
        <li class="lp-signal is-reason" data-module="training">
          <span class="lp-signal-label">{{ L.day.training.label }}</span>
          <strong class="lp-signal-value">{{ L.day.training.value }}</strong>
          <span class="lp-signal-meta">{{ L.day.training.meta }}</span>
        </li>
        <li class="lp-signal" data-module="nutrition">
          <span class="lp-signal-label">{{ L.day.nutrition.label }}</span>
          <strong class="lp-signal-value">{{ L.day.nutrition.value }}</strong>
          <span class="lp-bar" aria-hidden="true"><span style="--v: 77%"></span></span>
        </li>
        <li class="lp-signal" data-module="water">
          <span class="lp-signal-label">{{ L.day.water.label }}</span>
          <strong class="lp-signal-value">{{ L.day.water.value }}</strong>
          <span class="lp-bar" aria-hidden="true"><span style="--v: 60%"></span></span>
        </li>
        <li class="lp-signal" data-module="weight">
          <span class="lp-signal-label">{{ L.day.weight.label }}</span>
          <strong class="lp-signal-value">{{ L.day.weight.value }}</strong>
          <span class="lp-signal-meta">{{ L.day.weight.meta }}</span>
        </li>
        <li class="lp-signal is-reason is-low" data-module="recovery">
          <span class="lp-signal-label">{{ L.day.sleep.label }}</span>
          <strong class="lp-signal-value">{{ L.day.sleep.value }}</strong>
          <span class="lp-signal-meta">{{ L.day.sleep.meta }}</span>
        </li>
      </ul>

      <div class="lp-rec" data-module="training">
        <span class="lp-rec-icon" aria-hidden="true">{{ module_icon("training") }}</span>
        <div class="lp-rec-body">
          <span class="lp-micro">{{ L.day.recLabel }}</span>
          <p class="lp-rec-title">{{ L.day.recTitle }}</p>
          <p class="lp-reasons">
            <span class="lp-reasons-label">{{ L.day.because }}:</span>
            <span class="lp-chip" data-module="recovery">{{ L.day.reasons.sleep }}</span>
            <span class="lp-chip" data-module="training">{{ L.day.reasons.recent }}</span>
            <span class="lp-chip">{{ L.day.reasons.readiness }}</span>
          </p>
        </div>
      </div>
    </figure>
  </div>
</section>
