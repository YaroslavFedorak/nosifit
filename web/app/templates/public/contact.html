  <div class="pub-contact-grid">
    <div class="pub-contact-card">
      <h3 class="pub-contact-title">{{ public_t("contact.email") }}</h3>
      <p class="pub-contact-text">support@nosi.fit</p>
    </div>

    <div class="pub-contact-card">
      <h3 class="pub-contact-title">{{ public_t("contact.instagram") }}</h3>
      <p class="pub-contact-text">@nosi.fit</p>
    </div>

    <div class="pub-contact-card">
      <h3 class="pub-contact-title">{{ public_t("contact.telegram") }}</h3>
      <p class="pub-contact-text">@nosi_support</p>
    </div>
  </div>

{% endblock %}
