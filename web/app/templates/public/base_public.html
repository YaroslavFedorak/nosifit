<!doctype html>
<html lang="{{ locale }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}{{ public_t("meta.title") }}{% endblock %}</title>

    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='img/Nosi_Logo.png') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/core/reset.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/core/variables.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/core/layout.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/navbar.css') }}"
    />

    {% block styles %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/core/system.css') }}" />
  </head>

  <body class="public-layout">
    <div class="bg-glow-static glow-purple" aria-hidden="true"></div>
    <div class="bg-glow-static glow-teal" aria-hidden="true"></div>
    <div class="bg-glow-static glow-yellow" aria-hidden="true"></div>
    <div class="bg-glow-dynamic" aria-hidden="true"></div>

    {% include "components/public_nav.html" %}

    <main class="public-wrapper">{% block body %}{% endblock %}</main>

    {% block scripts %}{% endblock %}
  </body>
</html>
