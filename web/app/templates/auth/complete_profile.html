<!doctype html>
<html lang="{{ locale }}">
  <head>
    <meta charset="UTF-8" />
    <title>{{ auth_t("profile.title") }} — nosifit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% include "components/brand_head.html" %}
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/auth/complete_profile.css') }}"
    />
  </head>

  <body>
    <!-- Background -->
    <div class="bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    
    <!-- Card -->
    <div class="auth-card">
      <div class="top-center">
        <div class="brand-compact">
          <h1 class="brand-title">
            <img src="{{ url_for('static', filename='img/brand/nosifit-lockup-on-dark.svg') }}" class="brand-logo" alt="NosiFit" />
          </h1>
        </div>

        <h2 class="title">{{ auth_t("profile.heading") }}</h2>
      </div>

      {% include "auth/_flashes.html" %}
      <form method="POST" class="auth-form" {% include "auth/_validate_attrs.html" %}>
        <div class="row two-cols">
          <div class="field" data-anim>
            <label>{{ auth_t("fields.age") }}</label>
            <input
              class="cmp-input"
              type="number"
              name="age"
              min="10"
              max="120"
              placeholder="18"
              required
            />
          </div>

          <div class="field" data-anim>
            <label>{{ auth_t("fields.height") }}</label>
            <input
              class="cmp-input"
              type="number"
              name="height"
              min="100"
              max="250"
              placeholder="180"
              required
            />
          </div>
        </div>

        <div class="row two-cols">
          <div class="field" data-anim>
            <label>{{ auth_t("fields.weight") }}</label>
            <input
              class="cmp-input"
              type="number"
              name="weight"
              min="30"
              max="300"
              placeholder="75"
              required
            />
          </div>

          <div class="field" data-anim>
            <label>{{ auth_t("fields.gender") }}</label>
            <select class="cmp-input" name="gender" required>
              <option value="" disabled selected>{{ auth_t("common.select") }}</option>
              <option value="male">{{ auth_t("fields.male") }}</option>
              <option value="female">{{ auth_t("fields.female") }}</option>
              <option value="other">{{ auth_t("fields.other") }}</option>
            </select>
          </div>
        </div>

        <div class="field" data-anim>
          <label>{{ auth_t("fields.activity") }}</label>
          <select class="cmp-input" name="activity" required>
            <option value="" disabled selected>{{ auth_t("common.select") }}</option>
            <option value="1.2">{{ auth_t("activity.minimum") }}</option>
            <option value="1.375">{{ auth_t("activity.light") }}</option>
            <option value="1.55">{{ auth_t("activity.medium") }}</option>
            <option value="1.725">{{ auth_t("activity.high") }}</option>
            <option value="1.9">{{ auth_t("activity.extreme") }}</option>
          </select>
        </div>

        <div class="row two-cols">
          <div class="field" data-anim>
            <label>{{ auth_t("fields.goal") }}</label>
            <select class="cmp-input" name="goal" required>
              <option value="" disabled selected>{{ auth_t("common.select") }}</option>
              <option value="lose">{{ auth_t("goals.lose") }}</option>
              <option value="maintain">{{ auth_t("goals.maintain") }}</option>
              <option value="gain">{{ auth_t("goals.gain") }}</option>
            </select>
          </div>

          <div class="field" data-anim>
            <label>{{ auth_t("fields.experience") }}</label>
            <select class="cmp-input" name="experience" required>
              <option value="" disabled selected>{{ auth_t("common.select") }}</option>
              <option value="beginner">{{ auth_t("experience.beginner") }}</option>
              <option value="intermediate">Середній</option>
              <option value="advanced">{{ auth_t("experience.advanced") }}</option>
            </select>
          </div>
        </div>

        <div class="field" data-anim>
          <label>{{ auth_t("fields.workouts") }}</label>
          <input
            class="cmp-input"
            type="number"
            name="workouts"
            min="0"
            max="14"
            placeholder="6"
            required
          />
        </div>

        <div class="auth-actions">
          <a href="{{ url_for('root.landing') }}" class="btn-back">{{ auth_t("common.back") }}</a>
          <button class="btn-save" type="submit">{{ auth_t("common.save") }}</button
        </div>
      </form>
    </div>

    <script nonce="{{ csp_nonce() }}">
      window.addEventListener("load", () => {
        document.querySelectorAll("[data-anim]").forEach((el, i) => {
          el.style.setProperty("--stagger", i * 60 + "ms");
          el.classList.add("reveal");
        });
      });
    </script>
    {% include "auth/_lang.html" %}
  </body>
</html>
