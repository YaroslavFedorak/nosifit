<!doctype html>
<html lang="{{ locale }}">
  <head>
    <meta charset="UTF-8" />
    <title>{{ auth_t("reset.title") }} — nosifit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% include "components/brand_head.html" %}
    <link rel="stylesheet" href="/static/css/auth/reset_password.css" />
  </head>

  <body>
    <div class="bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    
    <div class="auth-card">
      <div class="progress-wrapper">
        <div class="progress-line">
          <div class="progress-fill" style="width: 50%"></div>
        </div>

        <div class="progress-steps">
          <div class="step completed" data-label="{{ auth_t("common.email") }}"></div>
          <div class="step active" data-label="{{ auth_t("reset.step") }}"></div>
        </div>
      </div>

      <div class="brand-compact">
        <h1 class="brand-title">
          <img src="{{ url_for('static', filename='img/brand/nosifit-lockup-on-dark.svg') }}" class="brand-logo" alt="NosiFit" />
        </h1>
      </div>

      <h2 class="auth-card-title">{{ auth_t("reset.heading") }}</h2>

      {% if error %}
      <div class="auth-error">{{ error }}</div>
      {% endif %}

      {% include "auth/_flashes.html" %}
      <form method="POST" class="auth-form" {% include "auth/_validate_attrs.html" %}>
        <label class="form-label">
          Email
          <input
            class="cmp-input"
            type="email"
            name="email"
            placeholder="example@gmail.com"
            required
          />
        </label>

        <div class="auth-actions">
          <button class="cmp-btn-primary" type="submit">{{ auth_t("reset.submit") }}</button>
          <a class="link-muted" href="{{ url_for('auth.login') }}"
            >{{ auth_t("common.backToLogin") }}</a
          >
        </div>
      </form>
    </div>
    {% include "auth/_lang.html" %}
  </body>
</html>
