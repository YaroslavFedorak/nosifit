<!doctype html>
<html lang="{{ locale }}">
  <head>
    <meta charset="UTF-8" />
    <title>{{ auth_t("newPassword.title") }} — nosifit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% include "components/brand_head.html" %}
    <link rel="stylesheet" href="/static/css/auth/new_password.css" />
  </head>

  <body>
    <div class="bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    
    <div class="auth-card">
      <div class="progress-wrapper">
        <div class="progress-line">
          <div class="progress-fill"></div>
        </div>

        <div class="progress-steps">
          <div class="step completed" data-label="{{ auth_t("common.email") }}"></div>
          <div class="step active" data-label="{{ auth_t("reset.step") }}"></div>
          <div class="step" data-label="{{ auth_t("reset.done") }}"></div>
        </div>
      </div>

      <div class="brand-compact">
        <h1 class="brand-title">
          <img src="{{ url_for('static', filename='img/brand/nosifit-lockup-on-dark.svg') }}" class="brand-logo" alt="NosiFit" />
        </h1>
      </div>

      <h2 class="auth-card-title">{{ auth_t("newPassword.heading") }}</h2>

      {% include "auth/_flashes.html" %}
      <form method="POST" class="auth-form" {% include "auth/_validate_attrs.html" %}>
        <label class="form-label">
          {{ auth_t("newPassword.password") }}
          <div class="password-wrapper">
            <input
              class="cmp-input"
              type="password"
              name="password"
              id="password"
              required
            />
            <button
              type="button"
              class="toggle-pass"
              data-toggle-target="password"
            >
              {{ auth_t("common.show") }}
            </button>
          </div>
        </label>

        <label class="form-label">
          {{ auth_t("newPassword.confirmation") }}
          <div class="password-wrapper">
            <input
              class="cmp-input"
              type="password"
              name="confirm"
              id="confirm"
              required
            />
            <button
              type="button"
              class="toggle-pass"
              data-toggle-target="confirm"
            >
              {{ auth_t("common.show") }}
            </button>
          </div>
        </label>

        <div class="auth-actions">
          <a class="btn-back" href="{{ url_for('auth.reset_password') }}"
            >Назад</a
          >
          <button class="cmp-btn-primary" type="submit">{{ auth_t("newPassword.submit") }}</button>
        </div>
      </form>
    </div>

    <script nonce="{{ csp_nonce() }}">
      function togglePassword(id, btn) {
        const input = document.getElementById(id);
        if (input.type === "password") {
          input.type = "text";
          btn.textContent = "{{ auth_t("common.hide") }}";
        } else {
          input.type = "password";
          btn.textContent = "{{ auth_t("common.show") }}";
        }
      }
      document.querySelectorAll("[data-toggle-target]").forEach((btn) => {
        btn.addEventListener("click", () => togglePassword(btn.dataset.toggleTarget, btn));
      });
    </script>
    {% include "auth/_lang.html" %}
  </body>
</html>
