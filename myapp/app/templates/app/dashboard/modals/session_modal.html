<div id="session-summary-modal" class="session-modal" aria-hidden="true">
  <div class="session-modal-backdrop" data-session-modal-close></div>

  <div
    class="session-modal-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="session-summary-title"
  >
    <div class="session-modal-header">
      <div>
        <span class="session-modal-eyebrow"> Тренування завершено </span>

        <h2 id="session-summary-title">Сесію збережено</h2>

        <p id="session-summary-subtitle">
          Твоє тренування успішно додано до історії.
        </p>
      </div>

      <button
        type="button"
        class="session-modal-close"
        data-session-modal-close
        aria-label="Закрити"
      >
        &times;
      </button>
    </div>

    <div class="session-summary-grid">
      <div class="session-summary-card session-summary-card-primary">
        <span class="session-summary-label"> Навантаження </span>

        <div class="session-summary-value-row">
          <strong id="session-summary-load"> — </strong>

          <span class="session-summary-unit"> load </span>
        </div>

        <span id="session-summary-load-state" class="session-summary-status">
          —
        </span>
      </div>

      <div class="session-summary-card">
        <span class="session-summary-label"> Складність </span>

        <div class="session-summary-value-row">
          <strong id="session-summary-rpe"> — </strong>

          <span class="session-summary-unit"> / 10 </span>
        </div>

        <span class="session-summary-status"> RPE </span>
      </div>

      <div class="session-summary-card">
        <span class="session-summary-label"> Відновлення </span>

        <div class="session-summary-value-row">
          <strong id="session-summary-recovery"> — </strong>

          <span class="session-summary-unit"> год </span>
        </div>

        <span class="session-summary-status"> рекомендовано </span>
      </div>
    </div>

    <section class="session-summary-section">
      <div class="session-summary-section-header">
        <div>
          <span class="session-summary-section-eyebrow"> Аналіз </span>

          <h3>Навантаження на м'язи</h3>
        </div>
      </div>

      <div id="session-muscle-loads" class="session-muscle-loads">
        <!-- JS renders muscle load items here -->
      </div>
    </section>

    <section
      id="session-recovery-section"
      class="session-summary-section session-recovery-section"
    >
      <div class="session-recovery-icon">↗</div>

      <div class="session-recovery-content">
        <span class="session-summary-section-eyebrow"> Відновлення </span>

        <h3 id="session-recovery-title">Рекомендація</h3>

        <p id="session-recovery-message">Аналізуємо твоє тренування...</p>
      </div>
    </section>

    <div class="session-modal-footer">
      <button
        type="button"
        class="tr-btn tr-btn-ghost"
        data-session-modal-close
      >
        Закрити
      </button>

      <button
        type="button"
        id="session-modal-history"
        class="tr-btn tr-btn-primary"
      >
        Переглянути історію
      </button>
    </div>
  </div>
</div>
