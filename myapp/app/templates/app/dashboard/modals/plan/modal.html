<div id="db-plan-modal" class="db-modal" aria-hidden="true">
  <div
    class="db-modal-content"
    role="dialog"
    aria-modal="true"
    aria-labelledby="db-plan-modal-title"
  >
    <header class="db-plan-header">
      <div class="db-plan-title-block">
        <span class="db-plan-title-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect width="16" height="20" x="4" y="2" rx="3" />
            <path d="M2 6h4M2 10h4M2 14h4M2 18h4" />
            <path d="M15 2v20" />
            <path d="M15 7h5M15 12h5M15 17h5" />
          </svg>
        </span>

        <h3 id="db-plan-modal-title" class="db-plan-title">План тренування</h3>
      </div>

      <div class="db-plan-header-actions">
        <button
          id="db-plan-help-toggle"
          class="db-plan-help-btn"
          type="button"
          aria-label="Допомога"
          aria-expanded="false"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            stroke="currentColor"
            fill="none"
            stroke-width="2"
          >
            <circle cx="9" cy="9" r="8" />
            <path d="M9 13v-2a2 2 0 1 0-2-2" />
            <circle cx="9" cy="16" r="1" />
          </svg>
        </button>

        <button class="db-modal-close" data-close-plan-modal type="button">
          ×
        </button>
      </div>
    </header>

    <div id="db-plan-help" class="db-plan-help-popover">
      <ul class="db-plan-help-list">
        <li>Перегляньте вправи запланованого тренування</li>
        <li>Натисніть на вправу, щоб переглянути деталі</li>
      </ul>
    </div>

    <div class="db-plan-body">
      <div class="db-plan-name-block">
        <label for="db-plan-title" class="db-plan-name-label"
          >Назва плану</label
        >
        <input
          id="db-plan-title"
          class="db-input db-plan-title"
          placeholder="Наприклад: Full Body"
          maxlength="80"
        />
      </div>

      <div class="db-plan-days" id="db-plan-days"></div>

      <section class="db-plan-column">
        <div class="db-plan-toolbar">
          <div class="db-plan-toolbar-left">
            <span class="db-plan-toolbar-title">Вправи цього дня</span>
            <span
              id="db-plan-day-summary"
              class="db-plan-toolbar-subtitle"
            ></span>
          </div>

          <button
            class="db-btn db-btn-primary db-plan-add-exercise"
            type="button"
          >
            + Додати вправу
          </button>
        </div>

        <div class="db-plan-exercises" id="db-plan-exercises"></div>

        <div
          id="db-plan-empty"
          class="db-plan-empty"
          role="status"
          aria-live="polite"
        >
          <div class="db-plan-empty-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="40"
              height="40"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M17.6 12.8a2 2 0 1 0 2.8-2.8l-1.8-1.8a2 2 0 0 0 2.8-2.8l-2.8-2.8a2 2 0 0 0-2.8 2.8l-1.8-1.8a2 2 0 1 0-2.8 2.8z"
              />
              <path d="m2.5 21.5 1.4-1.4" />
              <path d="m20.1 3.9 1.4-1.4" />
              <path
                d="M5.3 21.5a2 2 0 1 0 2.8-2.8l1.8 1.8a2 2 0 1 0 2.8-2.8l-6.4-6.4a2 2 0 1 0-2.8 2.8l1.8 1.8a2 2 0 0 0-2.8 2.8z"
              />
              <path d="m9.6 14.4 4.8-4.8" />
            </svg>
          </div>

          <div class="db-plan-empty-text-main">План цього дня порожній</div>
          <div class="db-plan-empty-text-sub">
            Додайте першу вправу, щоб почати тренування
          </div>

          <button class="db-btn db-btn-primary db-plan-empty-add" type="button">
            + Додати вправу
          </button>
        </div>
      </section>
    </div>

    <footer class="db-plan-footer">
      <div class="db-plan-footer-summary">
        <span id="db-plan-summary-count">0 вправ</span>
        <span id="db-plan-summary-sets">0 підходів</span>
      </div>

      <div class="db-plan-footer-actions">
        <button
          class="db-btn db-btn-secondary"
          data-close-plan-modal
          type="button"
        >
          Скасувати
        </button>

        <button id="db-plan-save" class="db-btn db-btn-primary" type="button">
          <span class="btn-text">Зберегти план</span>
          <span class="btn-loader hidden" aria-hidden="true"></span>
        </button>
      </div>
    </footer>
  </div>
</div>
