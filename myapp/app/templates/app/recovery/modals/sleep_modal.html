<div class="recovery-modal-backdrop" id="sleep-modal-backdrop" hidden>
  <div class="recovery-modal">
    <div class="recovery-modal-header">
      <span class="recovery-modal-title">Додати сон</span>
      <button
        id="close-sleep-modal"
        class="cmp-btn-secondary cmp-btn-sm"
        type="button"
        data-close-sleep
      >
        Закрити
      </button>
    </div>

    <div class="recovery-modal-body sleep-modal-inputs">
      <div class="sleep-field">
        <label for="sleep-date-input">Дата</label>
        <input
          type="date"
          id="sleep-date-input"
          class="sleep-input"
          data-sleep-date
        />
      </div>

      <div class="sleep-field">
        <label for="sleep-start-time-input">Початок</label>
        <input
          type="time"
          id="sleep-start-time-input"
          class="sleep-input"
          data-sleep-start-time
        />
      </div>

      <div class="sleep-field">
        <label for="sleep-end-time-input">Кінець</label>
        <input
          type="time"
          id="sleep-end-time-input"
          class="sleep-input"
          data-sleep-end-time
        />
      </div>
    </div>

    <div class="recovery-modal-footer">
      <button
        id="save-sleep"
        class="cmp-btn-primary cmp-btn-sm"
        type="button"
        data-save-sleep
      >
        Зберегти
      </button>
    </div>
  </div>
</div>
